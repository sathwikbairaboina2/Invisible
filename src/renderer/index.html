<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline';"
    />
    <title>Invisible</title>
    <style>
      /* The window itself is transparent; only painted boxes are visible.
         Any opaque background here would defeat the point. */
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
        font: 13px/1.5 "Segoe UI", system-ui, sans-serif;
        color: #e8e8ea;
        user-select: none;
        -webkit-user-select: none;
      }

      #root {
        display: flex;
        flex-direction: column;
        gap: 8px;
        height: 100vh;
        padding: 12px;
        box-sizing: border-box;
      }

      .panel {
        background: rgba(18, 18, 22, 0.82);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 10px;
        padding: 10px 12px;
        backdrop-filter: blur(12px);
      }

      #status {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 11px;
        color: #9aa0a6;
      }

      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #4b5563;
      }
      .dot.live {
        background: #34d399;
      }
      .dot.error {
        background: #f87171;
      }

      #meters {
        display: flex;
        gap: 8px;
        margin-left: auto;
      }
      .meter {
        width: 44px;
        height: 4px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.1);
        overflow: hidden;
      }
      .meter > i {
        display: block;
        height: 100%;
        width: 0%;
        background: #60a5fa;
      }

      #answer {
        flex: 1;
        overflow-y: auto;
        white-space: pre-wrap;
        font-size: 14px;
      }
      #answer.streaming::after {
        content: "▌";
        opacity: 0.6;
      }

      #transcript {
        max-height: 120px;
        overflow-y: auto;
        font-size: 11px;
        color: #9aa0a6;
      }
      #transcript .user {
        color: #60a5fa;
      }
      #transcript .remote {
        color: #d4d4d8;
      }

      #errors {
        font-size: 11px;
        color: #fca5a5;
      }
      #errors:empty {
        display: none;
      }

      body.interactive .panel {
        border-color: rgba(96, 165, 250, 0.55);
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="panel" id="status">
        <span class="dot" id="dot"></span>
        <span id="statusText">starting</span>
        <span id="meters">
          <span class="meter" title="microphone"><i id="meterUser"></i></span>
          <span class="meter" title="system audio"><i id="meterRemote"></i></span>
        </span>
      </div>
      <div class="panel" id="answer"></div>
      <div class="panel" id="transcript"></div>
      <div id="errors"></div>
    </div>
    <script src="./app.js"></script>
  </body>
</html>
