# Local services for Invisible, deliberately separate from any other project's
# stack.
#
# Only Qdrant lives here. Generation and embedding go to the Ollama installed
# on the host (127.0.0.1:11434, the OLLAMA_HOST default in src/main/config.js),
# which every project on this machine shares: one runtime, one model store,
# and the GPU attached natively. The per-project container this file used to
# run cost RAM the box does not have. Pull once on the host:
#   ollama pull qwen3.8:27b
#   ollama pull nomic-embed-text
#
# Two settings that container carried now belong to the host daemon, as user
# environment variables read by the Ollama app: OLLAMA_MAX_LOADED_MODELS=2 so
# the embedder and the 27B stay resident together (measured thrash without it:
# first token 164 ms -> 4823 ms), and OLLAMA_KEEP_ALIVE, which this app also
# sends per request (agent.keepAlive) so the daemon default does not matter.

name: invisible

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: invisible-qdrant
    restart: unless-stopped
    ports:
      # 6333 is free on this machine. Bound to loopback: the corpus is a
      # résumé and prepared interview answers, and nothing about it should be
      # reachable from the network.
      - "127.0.0.1:6333:6333"
    volumes:
      - invisible-qdrant-storage:/qdrant/storage

volumes:
  invisible-qdrant-storage:
